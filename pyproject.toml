[project]
name = "investment-research-analyst-agent"
version = "0.1.0"
description = "A learning project for an investment research analyst agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "chromadb>=1.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-chroma>=1.1",
    "langchain-openai>=1.4",
    "langchain-text-splitters>=1.1",
    "langgraph>=1.0",
    "opensearch-py>=3.0",
    "pypdf>=5.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
